name: Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'main'

jobs:
  tests:
    name: PHP ${{ matrix.php-version }} on ${{ matrix.os }} (${{ matrix.composer-options }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.php-version == '8.2' }}
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.0"
          - "8.1"
          - "8.2"
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: pcntl, posix
          coverage: xdebug
          ini-values: error_reporting=E_ALL

      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Normalize ALLURE_MATRIX_ENV
        run: |
          raw_value="${{ matrix.os }}-php-${{ matrix.php-version }}"
          value="$raw_value"
          value="${value//./_}"
          value="${value//\*/x}"
          echo "ALLURE_MATRIX_ENV=${value}" >> "$GITHUB_ENV"
          echo "ALLURE_TEST_DUMP_NAME=allure-results-${value}" >> "$GITHUB_ENV"

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer update
          --prefer-dist
          --no-progress

      - name: Run tests
        if: ${{ matrix.php-version != '8.2' }}
        run: |
          npx -y allure@3 run --config ./allurerc.mjs --rerun 2 --environment="${{ env.ALLURE_MATRIX_ENV }}" --dump="${{ env.ALLURE_TEST_DUMP_NAME }}" -- \
          composer test

      - name: Run tests (experimental)
        if: ${{ matrix.php-version == '8.2' }}
        continue-on-error: true
        run: |
          npx -y allure@3 run --config ./allurerc.mjs --rerun 2 --environment="${{ env.ALLURE_MATRIX_ENV }}" --dump="${{ env.ALLURE_TEST_DUMP_NAME }}" -- \
          composer test

      - name: Upload report dump
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ALLURE_TEST_DUMP_NAME }}
          path: ./${{ env.ALLURE_TEST_DUMP_NAME }}.zip
          retention-days: 1

  report:
    needs: [tests]
    name: Build Allure report
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
      ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Download Allure dumps
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: ./
          merge-multiple: true

      - name: Generate Allure report
        run: npx -y allure@3 generate --config ./allurerc.mjs --dump="allure-results-*.zip" --output=./out/allure-report

      - name: Post Allure summary
        if: ${{ always() && !cancelled() && contains(fromJSON('["success","failure"]'), needs.tests.result) }}
        uses: allure-framework/allure-action@v0
        with:
          report-directory: ./out/allure-report
